<!doctype html>
<html><head><meta charset="utf-8"><title>Maskot</title>
<style>html,body{margin:0;background:transparent}#c{display:none}#m{display:block}</style></head>
<body><canvas id="c"></canvas><canvas id="m"></canvas>
<script type="module">
// Mağaza görselleri için oyun karakterini şeffaf zeminde büyük çizer.
// ?c=karakter(0-3) &p=fart|burp|wave &w=piksel
import { THREE, PUFF_TEX } from '/src/core.js';
import { buildCharacter, animateCharacter } from '/src/chars.js';

const q = new URLSearchParams(location.search);
const ci = +(q.get('c') || 0), pose = q.get('p') || 'fart', W = +(q.get('w') || 1400);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('m'), alpha: true, antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(1); r.setSize(W, W); r.outputColorSpace = THREE.SRGBColorSpace; r.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x88aa66, 1.7));
const sun = new THREE.DirectionalLight(0xffffff, 2.3); sun.position.set(3, 6, 6); scene.add(sun);

const ch = buildCharacter(ci, ci);
scene.add(ch.root);
const p = { power: pose === 'burp' ? 'burp' : 'fart', onRaft: true, moving: false, gasOn: pose === 'fart', charge: pose === 'burp' ? 0.9 : 0, burpT: 0, dizzy: 0 };
for (let i = 0; i < 60; i++) animateCharacter(ch, p, 1.3, 1 / 30);
ch.body.scale.set(pose === 'burp' ? 1.15 : 1, 1, pose === 'burp' ? 1.15 : 1);

const puff = (x, y, z, s, color, op = 0.95) => {
  const m = new THREE.Sprite(new THREE.SpriteMaterial({ map: PUFF_TEX, color, transparent: true, opacity: op, depthWrite: false }));
  m.position.set(x, y, z); m.scale.setScalar(s); m.material.rotation = Math.random() * 6; scene.add(m);
};
const cam = new THREE.PerspectiveCamera(28, 1, 0.1, 100);
if (pose === 'fart') {
  ch.root.rotation.y = Math.PI - 0.55;           // yüzü bize dönük, popo sağ arkada
  ch.body.rotation.x = -0.25;
  ch.arms[1].rotation.z = 2.5;                   // el sallıyor
  const G = [0xa6e22e, 0x8fd12a, 0xc4ef4a, 0x9bd94a];
  [[0.5, 0.42, -0.45, 0.42], [0.75, 0.5, -0.6, 0.6], [1.02, 0.62, -0.7, 0.75], [1.3, 0.8, -0.8, 0.9]]
    .forEach(([x, y, z, s], i) => puff(x, y, z, s, G[i % 4], 0.95 - i * 0.07));
  cam.position.set(0.35, 1.0, 5.4); cam.lookAt(0.35, 0.72, 0);
} else if (pose === 'burp') {
  ch.root.rotation.y = Math.PI + 0.55;
  ch.head.rotation.x = -0.25; ch.mouth.scale.setScalar(1);
  const B = [0xfff3b0, 0xffe27a, 0xffd6e6, 0xfff9d9];
  [[0.62, 1.0, 0.45, 0.42], [0.9, 1.06, 0.5, 0.6], [1.2, 1.12, 0.5, 0.78], [1.55, 1.18, 0.45, 0.92]].forEach(([x, y, z, s], i) => puff(x, y, z, s, B[i % 4], 0.95 - i * 0.07));
  cam.position.set(0.45, 1.0, 5.4); cam.lookAt(0.45, 0.75, 0);
} else {
  ch.root.rotation.y = Math.PI + (ci % 2 ? 0.45 : -0.45);
  ch.arms[ci % 2 ? 1 : 0].rotation.z = (ci % 2 ? 1 : -1) * 2.5;
  cam.position.set(0, 0.95, 5.2); cam.lookAt(0, 0.62, 0);
}
r.render(scene, cam);
window.done = true;
</script></body></html>
